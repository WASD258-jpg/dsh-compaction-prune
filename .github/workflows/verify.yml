name: verify

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Runs first: a leaked credential or local path is more serious than a test
  # failure, and git history is not undone by a later commit.
  privacy:
    name: privacy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No credentials, local paths, private addresses, or session data
        run: node privacy-check.mjs .

      - name: Commit identity is not personal
        run: |
          BAD=$(git log --format='%an <%ae>%n%cn <%ce>' | sort -u \
            | grep -vE 'noreply@example\.com|users\.noreply\.github\.com|^$' || true)
          if [ -n "$BAD" ]; then
            echo "Commit identity is not the neutral placeholder:"
            echo "$BAD"
            echo ""
            echo "  git config user.name  dsh-compaction-prune"
            echo "  git config user.email noreply@example.com"
            exit 1
          fi
          echo "commit identity ok"

  test:
    name: tests
    needs: privacy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The plugin declares node >=22.19. Test the floor and the current LTS.
        node: ['22.19', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install pinned harness packages
        run: npm install --no-audit --no-fund

      - name: Decision logic
        run: node tests/decide.spec.mjs

      - name: Mount behaviour and config validation
        run: node tests/mount.spec.mjs

      - name: Configuration loading
        run: node tests/config-loading.spec.mjs

      - name: Package-name availability
        run: node tests/availability.spec.mjs

      # The measurement tooling reads session logs from a path that must not be
      # baked into the repository. A developer path was committed into 12 places
      # once already; this asserts none returns.
      #
      # .github is excluded: this file contains the patterns themselves, so a
      # naive scan matches its own grep and fails forever.
      - name: No developer path is embedded
        run: |
          hits=$(grep -rIl --exclude-dir=node_modules --exclude-dir=.git \
                   --exclude-dir=.github \
                   -e 'C:\\Users\\' -e '/home/' -e '/Users/' . || true)
          if [ -n "$hits" ]; then
            echo "a developer path is embedded in:"
            echo "$hits"
            exit 1
          fi
          echo "no developer path embedded"

      - name: Session tooling is portable
        run: |
          # Each tool must reach its own empty-result path rather than crashing on
          # a missing directory or a missing import. That distinguishes a portable
          # script from one that only runs where it was written -- which is how a
          # developer path survived in twelve places.
          for f in tools/recon.mjs tools/trace.mjs tools/trigger-audit.mjs; do
            out=$(DSH_HOME=/tmp/nonexistent-dsh-home node "$f" 2>&1 || true)
            if echo "$out" | grep -qE 'ERR_MODULE_NOT_FOUND|is not defined|ENOENT'; then
              echo "FAIL: $f is not portable"
              echo "$out" | head -4
              exit 1
            fi
            echo "ok: $f"
          done
      - name: Boot through the real Cordis Loader
        run: node tests/loader-e2e.spec.mjs

      - name: Test suites fail loudly on a positive problem marker
        run: bash tools/ci-test-preflight.sh
        # The script carries a positive run plus two negative controls: a synthetic
        # suite that prints a marker must fail the step, and one that exits non-zero
        # must fail it too. A guard that cannot fail is not a guard.
        #
        # Moving it into a script also means local preflight and CI run the same
        # code, so they cannot drift -- the previous inline version passed locally
        # under PowerShell while failing on the runner.

  package:
    name: package integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'

      - name: Required files exist
        run: |
          for f in README.md README.zh.md LIMITATIONS.md LIMITATIONS.zh.md LICENSE src/index.js cordis.patch.yml; do
            [ -f "$f" ] || { echo "missing: $f"; exit 1; }
            echo "ok: $f"
          done

      - name: package.json files[] covers required documents
        run: |
          node - <<'EOF'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const files = pkg.files ?? []
          const required = ['README.md', 'README.zh.md', 'LIMITATIONS.md', 'LIMITATIONS.zh.md', 'LICENSE']
          const missing = required.filter(f => !files.includes(f))
          if (missing.length) {
            console.error('package.json files[] omits: ' + missing.join(', '))
            process.exit(1)
          }
          console.log('files[] covers all required documents')
          EOF

      - name: The plugin declares a Config and a bundle patch
        run: |
          node - <<'EOF'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          if (pkg.dsh?.bundle?.patch !== './cordis.patch.yml') {
            console.error('package.json must declare dsh.bundle.patch')
            process.exit(1)
          }
          const src = fs.readFileSync('src/index.js', 'utf8')
          for (const need of ['export const Config', 'static Config', 'export const DEFAULTS']) {
            if (!src.includes(need)) {
              console.error('src/index.js is missing: ' + need)
              process.exit(1)
            }
          }
          console.log('plugin metadata present')
          EOF

  docs:
    name: documentation honesty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: README carries the withdrawal, in BOTH languages
        run: |
          # This plugin's credibility now rests on the withdrawal being visible. The
          # status moved from "effect not verified" to "measured, and the claim does
          # not hold", so the assertion moved with it: what must not disappear is the
          # withdrawal itself, in either language.
          #
          # The Chinese version is checked separately. A translation that quietly
          # drops a retraction would leave a Chinese reader installing a plugin the
          # English README tells them not to use -- easy to introduce, and it breaks
          # no build without this check.
          grep -q 'LIMITATIONS.md' README.md || { echo "README.md must link LIMITATIONS.md"; exit 1; }
          grep -qiE 'Do not use this plugin|does not work|withdrawn|retract' README.md || {
            echo "README.md must carry the withdrawal"; exit 1; }
          grep -qiE 'not a fix|deliberately incomplete|partial' README.md || {
            echo "README.md must state that this is a partial measure"; exit 1; }

          grep -q 'LIMITATIONS' README.zh.md || { echo "README.zh.md must link LIMITATIONS"; exit 1; }
          grep -qE '不要使用本插件|不成立|撤回' README.zh.md || {
            echo "README.zh.md must carry the withdrawal"; exit 1; }
          grep -qE '刻意不完整|不是修复|部分措施' README.zh.md || {
            echo "README.zh.md must state that this is a partial measure"; exit 1; }

          echo "ok: both READMEs carry the withdrawal"

      - name: LIMITATIONS states the upstream requirements, in BOTH languages
        run: |
          for f in LIMITATIONS.md LIMITATIONS.zh.md; do
            grep -q 'breakerTripped' "$f" || {
              echo "$f must show the upstream guard that is needed"; exit 1; }
            grep -q '7626' "$f" || {
              echo "$f must cite the relevant upstream discussion"; exit 1; }
            echo "ok: $f"
          done

      - name: Bilingual pairs are consistent
        run: |
          node tools/check-language-pairs.mjs .
          node tools/check-links.mjs .
